{% extends 'base.html' %}
{% block content %}
<h2>Build {{ routine_type }} Routine</h2>

<form method="POST">
    {% csrf_token %}
    {% for product in products %}
        <label>
            <input type="checkbox" name="products" value="{{ product.id }}">
            {{ product.name }}
        </label><br>
    {% endfor %}
    <button type="submit">Save Routine</button>
</form>
{% endblock %}
