{% extends 'base.html' %}
{% block content %}
<h2>Add Question and Options</h2>
<form method="POST">
  {% csrf_token %}
  {{ q_form.as_p }}
  {{ formset.management_form }}
  {% for form in formset %}
    <div style="margin-bottom: 10px; border: 1px solid #ccc; padding: 10px;">
      {{ form.as_p }}
    </div>
  {% endfor %}
  <button type="submit">Save</button>
</form>

{% endblock %}
