{% extends 'base.html' %}
{% block title %}Delete Doctor{% endblock %}

{% block content %}
<h2>Confirm Deletion</h2>
<p>Are you sure you want to delete <strong> {{ product.name }} ???</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'doctor_list' %}">Cancel</a>
</form>
{% endblock %}
