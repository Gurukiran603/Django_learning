{% extends 'base.html' %}
{% block title %}Add Product{% endblock %}

{% block content %}
<h2>Add New Product</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<button><a href="{% url 'product_list' %}">Back to Products</a></button>
{% endblock %}
