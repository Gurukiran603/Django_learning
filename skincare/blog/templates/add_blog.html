{% extends 'base.html' %}
{% block content %}
<h2>Add Blog Post</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Blog</button>
</form>
<button><a href="{% url 'blog_list' %}">← Back to blog list</a></button>
{% endblock %}
