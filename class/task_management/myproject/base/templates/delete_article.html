{% extends 'main.html' %}
{% block content %}
<h2>Delete Task</h2>
<p>Are you sure you want to delete the task "{{ data.title }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>
<a href="{% url 'read_article' %}">No, take me back</a>
{% endblock %}
