{% extends 'main.html' %}
{% block content %}
<h1>Create Article 👻</h1>

<a href="{% url 'read_article' %}"><button>View all Articles</button></a>
<br><br><br>

<form method="POST">
    {% csrf_token %}   <!-- to prevent hacker attack -->
    <input type="text" name="title" placeholder="Title" required><br><br>
    <input type="text" name="desc" placeholder="Description" required><br><br>
    <input type="text" name="author" placeholder="Author" required><br><br>
    <input type="number" name="cost" placeholder="Cost" required><br><br>

    <button type="submit">submit</button> <br>
</form>
{% endblock %}
