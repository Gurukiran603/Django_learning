{% extends 'main.html' %}
{% load static %}

{% block content %}

    <h1>hello World</h1>
    <ul>
        {% for i in guru %}
            <li>
                id:{{ i.id }} <br>
                subject:{{ i.subject }} <br>
                trainer:{{ i.trainer | upper }} <br>
                feedback:{{ i.feedback | truncatewords:2 }} <br>
                <a href="{% url 'about' i.id %}"><button>Read More..</button></a>
            </li><br>
        {% endfor %}
    </ul>
{% endblock %}
