{% block content %}
    <ul style="flex: auto; display: flex; gap: 20px; list-style-type: none; padding: 0;
    margin: 0; background-color: #be4444; border-radius: 5px;">
       
        {% if user.is_authenticated %}
         <li><a href="{% url 'read_article' %}"><button>Article List</button></a></li>
         <li><a href="{% url 'read_category' %}"><button>Categories</button></a></li>
            <li><a href="{% url 'profile' %}"><button>Profile</button></a></li>
            <li><a href="{% url 'signout' %}"><button>Sign out</button></a></li>
        {% else %}
            <li><a href="{% url 'signin' %}"><button>Sign in</button></a></li>
            <li><a href="{% url 'signup' %}"><button>Sign up</button></a></li>
        {% endif %}
    </ul>
{% endblock %}
