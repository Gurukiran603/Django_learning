{% extends "main.html" %}

{% block content %}
    <h2> Update Profile page</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="first_name" placeholder="first_name" value="{{ data.first_name }}" required> <br> <br>
        <input type="text" name="last_name" placeholder="last_name" value="{{ data.last_name }}" required> <br> <br>
        <input type="email" name="email" placeholder="email" value="{{ data.email }}" required> <br> <br>
        <input type="text" name="username" placeholder="username" value="{{ data.username }}" required> <br> <br>
        <button type="submit">submit</button>
    </form>

<a href="{% url 'profile' %}">Back to Profile</a>
{% endblock %}
